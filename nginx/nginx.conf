events {}

http {
  resolver 127.0.0.11 ipv6=off valid=10s;

  # ─── HLS segment cache ───────────────────────────────────────────
  # .ts segments arrive at nginx as 302 redirects from /api/media/hls/
  # pointing to MinIO presigned URLs. We cache the MinIO responses here.
  #
  # keys_zone=hls_cache:20m  → ~160 000 cache entries
  # max_size=50g             → 50 GB of cached segment data on disk
  # inactive=2h              → evict entries not accessed for 2 hours
  # ─────────────────────────────────────────────────────────────────
  proxy_cache_path /var/cache/nginx/hls
    levels=1:2
    keys_zone=hls_cache:20m
    max_size=50g
    inactive=2h
    use_temp_path=off;

  # Cache only the backend image proxy used for show thumbnails/banners.
  # Keep this separate from HLS so image churn cannot evict video segments.
  proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=image_cache:10m
    max_size=2g
    inactive=24h
    use_temp_path=off;

  # ─── Upstream pools ──────────────────────────────────────────────
  # keepalive keeps connections warm, avoiding per-request TCP handshakes
  upstream backend_pool {
    server backend:3000;
    keepalive 64;
  }

  upstream minio_pool {
    server minio:9000;
    keepalive 32;
  }

  # ─── Main server ─────────────────────────────────────────────────
  server {
    listen 80;

    # Allow large admin video uploads
    client_max_body_size 500M;

    # ── Admin UI ──────────────────────────────────────────────────
    location /admin/ {
      proxy_pass http://admin/;
    }

    location = /admin {
      return 301 /admin/;
    }

    # ── HLS .ts segments ─────────────────────────────────────────
    # The hlsProxy in media.controller.js issues a 302 redirect for .ts
    # files pointing to a MinIO presigned URL. Nginx follows that redirect
    # internally (proxy_pass to MinIO) and caches the segment so the next
    # user requesting the same segment gets it from disk, not MinIO.
    #
    # proxy_intercept_errors + error_page 302 makes nginx follow the
    # redirect transparently rather than forwarding it to the client.
    location ~* ^/api/media/hls/.+\.ts$ {
      # Step 1: ask the backend for the presigned redirect
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         $uri;           # keyed by /api/media/hls/…/seg_000.ts
      proxy_cache_valid       200 1h;         # segments are immutable — 1h is safe
      proxy_cache_valid       404 10s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;             # prevents cache stampede under concurrent load
      proxy_cache_lock_timeout 5s;

      add_header Cache-Control  "public, max-age=3600";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # ── HLS .m3u8 manifests ───────────────────────────────────────
    # Manifests are rewritten by the backend to stable proxy paths.
    # VOD manifests are immutable after transcoding, so a longer TTL avoids
    # repeat backend playlist rewrites under concurrent playback.
    location ~* ^/api/media/hls/.+\.m3u8$ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         $uri$is_args$args;
      proxy_cache_valid       200 15m;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 3s;

      add_header Cache-Control  "public, max-age=900";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache show thumbnails/banners only. This avoids touching streaming,
    # uploads, admin APIs, or the generic MinIO S3 proxy.
    location ~* ^/api/media/image/[^/]+/(thumbnail|banner)$ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             image_cache;
      proxy_cache_key         $uri$is_args$args;
      proxy_cache_valid       200 1h;
      proxy_cache_valid       404 30s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 3s;

      proxy_hide_header Cache-Control;
      add_header Cache-Control  "public, max-age=3600";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # ── All other Backend API routes ─────────────────────────────
    location /api/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
      return 301 /api/;
    }

    location /test {
      proxy_pass http://backend_pool/test;
    }

    # ── MinIO S3 API (admin uploads, image proxy fallback) ────────
    location /minio-api/ {
      proxy_pass         http://minio_pool/;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      client_max_body_size 500M;
    }

    # ── MinIO Console UI ─────────────────────────────────────────
    location /minio-console/ {
      proxy_pass http://minio:9001/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Default ──────────────────────────────────────────────────
    location / {
      return 302 /admin;
    }
  }
}
